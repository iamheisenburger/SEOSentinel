name: Pentra quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Schema compatibility compares the candidate with the base branch.
          # A shallow single-commit checkout cannot resolve origin/main (or
          # HEAD^) and turns a healthy additive schema into a false CI failure.
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full tests
        run: npm test

      - name: Lint application and backend
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check additive schema compatibility
        env:
          SCHEMA_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: npm run check:schema

      - name: Scan tracked source for secrets
        run: npm run scan:secrets

      - name: Audit production dependencies
        id: npm-audit
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high --fetch-timeout=60000 --fetch-retries=0; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done

      # npm's bulk advisory endpoint is an external dependency and can time out
      # even while package installs succeed. Preserve a fail-closed release gate
      # by scanning the exact lockfile with Google's independent OSV database.
      - name: Scan locked dependencies with OSV fallback
        id: osv-scan
        if: ${{ steps.npm-audit.outcome == 'failure' }}
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --output=osv-results.json
            --format=json

      - name: Validate OSV fallback completion
        if: ${{ steps.npm-audit.outcome == 'failure' }}
        env:
          OSV_SCAN_OUTCOME: ${{ steps.osv-scan.outcome }}
        run: |
          if [ ! -s osv-results.json ]; then
            echo "::error::OSV fallback failed without producing results."
            exit 1
          fi
          if [ "${OSV_SCAN_OUTCOME}" != "success" ]; then
            echo "OSV found dependency findings; the reporter will classify them."
          fi

      - name: Enforce OSV fallback findings
        if: ${{ steps.npm-audit.outcome == 'failure' }}
        uses: google/osv-scanner-action/osv-reporter-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        with:
          scan-args: |-
            --new=osv-results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Build production application with non-secret configuration
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          NEXT_PUBLIC_SITE_URL: https://pentra.dev
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
        run: npm run build

      - name: Install browser acceptance runtime
        run: npx playwright install --with-deps chromium

      - name: Run public browser acceptance tests
        env:
          NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
          NEXT_PUBLIC_SITE_URL: https://pentra.dev
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
        run: npm run test:e2e
